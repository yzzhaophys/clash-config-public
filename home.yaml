# ===== 锚点 Providers =====
rule-anchor:
  ip:           &ip           {type: http, behavior: ipcidr,    format: mrs,  interval: 86400, proxy: Final}
  domain:       &domain       {type: http, behavior: domain,    format: mrs,  interval: 86400, proxy: Final}
  yaml:         &yaml         {type: http, behavior: domain,    format: yaml, interval: 86400, proxy: Final}
  yaml-ip:      &yaml-ip      {type: http, behavior: ipcidr,    format: yaml, interval: 86400, proxy: Final}
